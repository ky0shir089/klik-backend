name: CI/CD BE Prod Sistem Keuangan

on:
  workflow_dispatch:

env:
  REGISTRY: dcr.devlmu.com
  REPOSITORY: siskeu-klik/be

jobs:
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      image_tag: ${{ steps.vars.outputs.tag }}
      latest_tag: ${{ steps.vars.outputs.latest_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.IMG_USER }}
          password: ${{ secrets.IMG_PASS }}

      - name: Determine image tags
        id: vars
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG="${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${SHORT_SHA}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest"
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t "${{ steps.vars.outputs.tag }}" \
            -t "${{ steps.vars.outputs.latest_tag }}" \
            .
      - name: Push Docker image (sha)
        run: |
          docker push "${{ steps.vars.outputs.tag }}"
      - name: Push Docker image (latest)
        run: |
          docker push "${{ steps.vars.outputs.latest_tag }}"
  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30m
          script: |
            set -euo pipefail
            REGISTRY="${{ env.REGISTRY }}"
            REPO="${{ env.REPOSITORY }}"
            SHA="${{ needs.build-push.outputs.sha }}"
            IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"
            LATEST_TAG="${{ needs.build-push.outputs.latest_tag }}"
            APP_DIR=/opt/apps/siskeu-be
            ENV_FILE="$APP_DIR/.env"
            # verify .env exists on server
            if [ ! -f "$ENV_FILE" ]; then
              echo "[ERROR] .env not found at $ENV_FILE"
              exit 1
            fi
            # login to registry
            docker login "$REGISTRY" -u "${{ secrets.IMG_USER }}" -p "${{ secrets.IMG_PASS }}"
            # try pulling sha-tagged image, fall back to latest
            IMAGE="$IMAGE_TAG"
            if ! docker pull "$IMAGE"; then
              echo "Failed to pull image with sha tag ($IMAGE). Falling back to latest."
              IMAGE="$LATEST_TAG"
              docker pull "$IMAGE"
            fi
            # stop & remove old container if exists
            if docker ps -a --format '{{.Names}}' | grep -Eq "^siskeu-klik-back\$"; then
              docker stop siskeu-klik-back || true
              docker rm siskeu-klik-back || true
            fi
            # run new container with server-side .env
            docker run -d \
              --restart unless-stopped \
              --name siskeu-klik-back \
              --env-file "$ENV_FILE" \
              -p 8000:8000 \
              -v /opt/apps/siskeu-be/file-sistem-keuangan/:/app/public \
              "$IMAGE"
            docker exec -u root siskeu-klik-back chown -R www-data:www-data /app/public/storage/file-uploads
            echo "Deployment finished. Running image: $IMAGE"
